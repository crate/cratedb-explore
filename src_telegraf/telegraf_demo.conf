# CrateDB Industrial IoT — Telegraf Demo Configuration
# =====================================================
# Receives IoT sensor readings via HTTP (posted by replay_to_telegraf.py)
# and writes them to CrateDB with Telegraf's native `outputs.cratedb` plugin,
# which speaks the PostgreSQL wire protocol (port 5432).
#
# NOTE: CrateDB has NO InfluxDB line-protocol ingest endpoint (there is no
# /_ingest/influxdb on port 4200). The only supported Telegraf → CrateDB path
# is the `outputs.cratedb` plugin over the Postgres wire — see CrateDB's
# "migrate from InfluxDB to CrateDB" guidance (swap outputs.influxdb →
# outputs.cratedb).
#
# The plugin writes the five-column metric shape — hash_id / timestamp /
# name / tags(OBJECT) / fields(OBJECT) — which is exactly the rtia.iot_data
# table in sql/rtia_schema_create.sql. Because `fields` is OBJECT(DYNAMIC),
# the geo coordinates ride along as fields['geo_lon'] / fields['geo_lat'],
# and CrateDB builds the GEO_POINT server-side via the GENERATED geo_location
# column. So geo DOES flow through Telegraf here — no COPY FROM required.
#
# Prerequisite: create the target table FIRST. table_create below is false on
# purpose — the plugin's auto-create cannot reproduce the GENERATED geo_location
# / day columns, so run sql/rtia_schema_create.sql (the CREATE TABLE part)
# before starting Telegraf.
#
# Field mapping (source JSON  ->  CrateDB column):
#   tags.*    (strings)  -> tags['device_id'], tags['status'], tags['plant_id'],
#                           tags['metadata_firmware_version'], …
#   fields.*  (floats)   -> fields['metric_value'], fields['quality_score'],
#                           fields['geo_lon'], fields['geo_lat']
#   geo_location (GEO_POINT) is GENERATED from fields['geo_lon']/['geo_lat'].
#
# Run:
#   telegraf --config telegraf_demo.conf
#
# Then in a second terminal:
#   python replay_to_telegraf.py                    # all 500,000 records, full speed
#   python replay_to_telegraf.py --delay 0.05       # ~2,000 rec/s, visible in CrateDB Admin UI
#   python replay_to_telegraf.py --limit 5000       # quick demo run

# ---------------------------------------------------------------------------
# Agent
# ---------------------------------------------------------------------------
# Reliability note: rtia.iot_data is PARTITIONED BY (day) and the dataset spans
# ~200 days, so on an empty table the first flushes must CREATE that many
# partitions — slow. With a tight flush_interval + short output timeout those
# writes get killed mid-flight, retried, and the buffer overflows = dropped
# rows. The settings below let a flush batch up and finish:
#   - flush_interval 10s + metric_batch_size 10000: fewer, larger inserts
#   - metric_buffer_limit 500000: hold the whole demo dataset if writes lag,
#     so nothing is ever discarded (raise it if you POST faster than CrateDB
#     can absorb the partition creation)
[agent]
  interval            = "1s"
  flush_interval      = "10s"
  metric_batch_size   = 10000
  metric_buffer_limit = 500000
  precision           = "1ms"
  quiet               = false

# ---------------------------------------------------------------------------
# Input: HTTP listener
# ---------------------------------------------------------------------------
# replay_to_telegraf.py POSTs one record per request, each already in
# {hash_id, timestamp, name, tags{}, fields{}} shape. The `object` block with
# path = "@this" parses that whole object into a single metric.
# NOTE: this input + json_v2 only accepts one object per request — a JSON array
# (bare or wrapped under a key) is rejected with HTTP 400, so the replay script
# posts records individually rather than batching them.
[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths           = ["/telegraf"]
  methods         = ["POST"]
  read_timeout    = "10s"
  write_timeout   = "10s"
  data_format     = "json_v2"

  [[inputs.http_listener_v2.json_v2]]
    measurement_name = "iot_data"

    # Parse the posted object into one metric. disable_prepend_keys keeps leaf names
    # (device_id, metric_value — not tags_device_id / fields_metric_value), so
    # the nested tags.* and fields.* keys flatten to their bare names.
    #
    # included_keys is the allow-list: only these become CrateDB tags/fields,
    # which drops the per-element hash_id / name (the outputs.cratedb plugin
    # computes its own hash_id and sets name from measurement_name).
    #
    # tags = [...] marks which of the included keys are tags; the rest
    # (metric_value, quality_score, geo_lon, geo_lat) are fields. geo_lon/geo_lat
    # ride along as doubles so geo_location can be GENERATED server-side.
    [[inputs.http_listener_v2.json_v2.object]]
      path                 = "@this"
      timestamp_key        = "timestamp"
      timestamp_format     = "2006-01-02 15:04:05"
      timestamp_timezone   = "UTC"
      disable_prepend_keys = true
      included_keys = [
        "device_id",
        "device_type",
        "plant_id",
        "line_id",
        "status",
        "metric_unit",
        "metadata_firmware_version",
        "metadata_model",
        "metadata_installation_date",
        "metadata_last_calibration",
        "metric_value",
        "quality_score",
        "geo_lon",
        "geo_lat",
      ]
      tags = [
        "device_id",
        "device_type",
        "plant_id",
        "line_id",
        "status",
        "metric_unit",
        "metadata_firmware_version",
        "metadata_model",
        "metadata_installation_date",
        "metadata_last_calibration",
      ]
      [inputs.http_listener_v2.json_v2.object.fields]
        metric_value  = "float"
        quality_score = "float"
        geo_lon       = "float"
        geo_lat       = "float"

# ---------------------------------------------------------------------------
# Output: CrateDB via the native outputs.cratedb plugin (PostgreSQL wire)
# ---------------------------------------------------------------------------
# url uses the PostgreSQL URI format: postgres://user:pass@host:port/db?params
# The table is schema-qualified so it targets rtia.iot_data regardless of the
# connection's default schema. table_create=false — the table must already
# exist with its GENERATED geo_location/day columns (see note at top).
[[outputs.cratedb]]
  url           = "postgres://crate@localhost:5432/crate?sslmode=disable"
  table         = "rtia.iot_data"
  table_create  = false
  key_separator = "_"
  # Generous timeout: the first flushes into an empty, day-partitioned table
  # create ~200 partitions and can take far longer than the 5s default. Too
  # short a timeout kills the write mid-flight, Telegraf retries, the buffer
  # backs up, and rows are dropped. 120s lets the slow first writes complete.
  timeout       = "120s"
  ## CrateDB Cloud — keep credentials out of the file via env vars
  ## (Telegraf substitutes ${VAR} at load time) and require TLS:
  # url = "postgres://${CRATE_USER}:${CRATE_PASSWORD}@<cluster>.cratedb.net:5432/crate?sslmode=require"

# ---------------------------------------------------------------------------
# Optional: also print line protocol to stdout for debugging
# ---------------------------------------------------------------------------
# [[outputs.file]]
#   files       = ["stdout"]
#   data_format = "influx"
